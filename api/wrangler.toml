name = "line-approval-bridge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Create the namespace with:  npx wrangler kv namespace create KV
# then replace the id below with the printed one (this one is the maintainer's).
[[kv_namespaces]]
binding = "KV"
id = "cab644ccd64041e2a7aadfa9f6807b24"

# Sends scheduled notifications (POST /api/notify with sendAt). Runs every minute.
[triggers]
crons = ["* * * * *"]

[vars]
DISPLAY_TZ = "Asia/Tokyo"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put LINE_CHANNEL_SECRET
#   npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
#   npx wrangler secret put API_TOKEN
#   npx wrangler secret put ALLOWED_USER_IDS
